summary-en: "Create full Chinese-style short drama videos from ideas or scripts."
summary-cn: "国风短剧全流程成片"
desc-en: "Full workflow for Chinese-style short-drama production. Step by step confirms script status, aspect ratio, character references, and visual direction; drives from script to storyboard brief, multi-angle character sheets, scene reference sheets, 2x4 monochrome panels, panel-level video prompts, video generation, and final assembly. Includes built-in Chinese-style and xianxia short-drama aesthetics plus full AI expression and natural-blink performance logic."
desc-cn: "全流程国风短剧制作工作流。分步确认脚本状态、画面比例、角色参考、画风方向；脚本→故事板概要→角色多角度设定图→场景设定图→2x4 黑白分镜→Panel 级视频提示词→视频→合成成片；内置国风/仙侠短剧画风与完整 AI 表情、自然眨眼表演逻辑。"
