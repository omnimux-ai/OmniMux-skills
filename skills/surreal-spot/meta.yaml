desc-en: "For TVC-grade surreal concept advertising shorts with impossible juxtaposition aesthetics. Takes a product photo and creative direction as input. Produces a scene breakdown, 9-panel storyboard and final motion video using cinematic lensing and lo-fi visual treatments including VHS, 16mm and Super8 film grain styles. Ideal for e-commerce creative shorts and brand concept advertising where visual novelty and artistic expression are priorities."
desc-cn: '适用于电商创意短片、TVC 概念广告等超现实视觉概念视频的制作,追求“不可能的并置”美学风格。输入产品图与创意方向,输出场景拆解、9 宫格分镜与最终动态视频,采用电影级镜头语言与 VHS、16mm、Super8 等低保真视觉媒介。特别适合需要强烈视觉冲击力与艺术表达的品牌广告场景,从概念构思到成片输出全流程覆盖。'
