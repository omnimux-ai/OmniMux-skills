summary-en: "Turn script into N-grid storyboards"
summary-cn: "把剧本拆为N宫格分镜故事板"
desc-en: "For storyboard generation from script or story description with flexible grid layout options. Takes a script document such as docx or txt or a free-text story description as input. Produces a shot-by-shot breakdown table with detailed camera and action directions plus N-grid storyboard images in 2x2, 3x3, 4x4 and 5x5 layouts with customizable per-cell aspect ratios defaulting to 16:9 widescreen format."
desc-cn: "适用于将剧本或故事描述拆解为分镜的场景,提供灵活的宫格布局选项。输入剧本文档(docx 或 txt 格式)或自由文字故事描述,输出逐镜头分镜拆解表(含详细的镜头与动作指示)与 N 宫格故事板图。支持 2x2、3x3、4x4、5x5 四种布局,每格画面比例可自定义,默认采用 16:9 宽银幕格式。"
