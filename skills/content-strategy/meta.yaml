summary-en: "Content strategist that decides what to write via searchable/shareable framework, buyer-stage mapping, and 4-factor scoring."
summary-cn: "内容策略师帮你选题：搜索传播分类、购买阶段、四维打分。"
desc-en: "Content Strategy helps decide what content to produce, not just write it. Gathers business, customer research, current state, and competitive context, then applies the searchable vs shareable framework across use-case, hub/spoke, thought-leadership, data-driven, and case-study types. Maps ideas to awareness / consideration / decision / implementation stages, scores by customer impact (40%) + content-market fit (30%) + search potential (20%) + resources (10%), and outputs content pillars, priority topics, and a topic cluster map."
desc-cn: "Content Strategy 帮用户决定要做什么内容，而不只是写。搜集商业背景、客户研究、现状与竞品格局，把 searchable vs shareable 框架应用到 use-case、hub/spoke、思想领导力、数据驱动、案例研究等类型上。把 idea 映射到 awareness / consideration / decision / implementation 四个购买阶段，按客户影响 (40%) + 内容市场契合 (30%) + 搜索潜力 (20%) + 资源 (10%) 打分，输出内容支柱、优先话题与话题簇地图。"
author-en: "MiniMax Design"
