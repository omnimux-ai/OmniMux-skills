summary-en: "Direct voice talent from brief and speakable script through casting, live-session, and pickup feedback — intention-based, not inflection-based."
summary-cn: "配音导演全流程：brief、脚本、选角、现场、补录反馈——讲意图不讲抑扬。"
desc-en: "Voiceover Direction covers the full workflow of directing voice talent: writing a specific VO brief with sound-alike and anti-references, rewriting scripts to be speakable (15-word sentences, contractions, breathing room, phonetic spellings), casting by acoustic and performance qualities, running the live session with intention-based cues rather than inflection commands, and giving structured pickup feedback that names timestamp, issue, desired change, and story reason. Includes templates, checklists, and worked SaaS-explainer and redirect examples."
desc-cn: "配音导演 skill 覆盖导演配音演员的完整流程：写有 sound-alike 和 anti-reference 的具体 VO brief；把脚本改到好念（15 词短句、连读、呼吸空间、音标标注复杂词）；按声学与表演特质选角；用「意图」而非「抑扬」命令来跑现场 session；给带时间戳、当前问题、期望改动和故事原因的结构化补录反馈。附模板、checklist 以及 SaaS 解说和现场掰回的实战示例。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
