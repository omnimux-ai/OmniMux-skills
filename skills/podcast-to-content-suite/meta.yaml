summary-en: "Transform a podcast transcript into a full content marketing suite — blog, social, newsletter, show notes, audiograms, SEO."
summary-cn: "把播客转录稿转成完整内容营销套件——博客、社交、newsletter、show notes 等。"
desc-en: "Podcast to Content Suite converts a podcast episode into a complete content marketing ecosystem from a single transcript. Produces an SEO-optimized blog post, social media content for Twitter/X, LinkedIn, Instagram, and Facebook, an email newsletter with subject variations, structured show notes with timestamps and resources, 3-5 audiogram clip scripts, and SEO elements including keywords, meta tags, and schema markup. Uses two reference files — component-specs.md for per-asset requirements and output-template.md for the final assembly format."
desc-cn: "播客转内容套件从一份播客转录稿产出完整的内容营销生态。产物包括 SEO 优化的博客、Twitter/X + LinkedIn + Instagram + Facebook 的社交内容、含主题行多版本的邮件 newsletter、带时间戳和资源的结构化 show notes、3-5 个音频卡片脚本，以及关键词、meta 标签、schema markup 的 SEO 元素。使用两份 reference 文件——component-specs.md 定义每类产物的要求，output-template.md 定义最终组装格式。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
