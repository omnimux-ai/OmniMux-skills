display-name-zh: 品牌字效迁移编辑器
version: 0.1.5
summary-en: "Transfer brand font effects from one image to another."
summary-cn: "识别并迁移品牌字效"
desc-en: "Brand font-effect transfer. Identifies logo lettering, bubble fonts, handwriting, decorative type, and brand custom fonts from a reference image, produces a font-identification report with commercial-free alternative suggestions, then transfers either the glyph shapes or the full font effect including stroke, gradient, highlight, and outer glow onto specified text in a target image while preserving position, size, and layout."
desc-cn: "品牌字效迁移。从参考图识别 Logo 字/泡泡字/手写字/装饰字/品牌定制字体，输出字体识别报告与商用免费替代建议，并将字形或完整字效（描边/渐变/高光/外发光）迁移替换到目标图的指定文字上，同时保留目标图的其他画面元素不变。"
