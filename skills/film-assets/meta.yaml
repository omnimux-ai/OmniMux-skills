desc-en: "For batch generation of pre-production reference assets covering characters, props and environments. Takes a target asset description such as character, prop or scene as input. Produces character cards with three, four and eight-view turnarounds, expression sheets, pose sheets, prop multi-view sheets and scene concept art with lighting, season and weather variants. Automatically determines optimal aspect ratio and layout composition."
desc-cn: "适用于影视前期批量生产参考资产,覆盖角色、道具与环境三大类别。输入目标资产(角色、道具或场景)描述,输出角色三视图、四视图、八视图转身图、表情包合集、姿势组图、道具多视图展示图、场景概念图(含光影变体、季节变体、天气变体)。自动判断最优画幅比例与排版构图方式。"
